# Web clients — Compose project homelab-frontend (same split as a local homelab).
# Do not combine this file with docker-compose.backend.yml in one `up`.
#
# Same host (after backend is up; APIs published on 8090 / 8001):
#   docker compose -f docker-compose.frontend.yml -f docker-compose.frontend.lan.yml up -d
# Device: set HUB_API_UPSTREAM and PKM_API_UPSTREAM in .env to the server.

name: homelab-frontend

services:
  hub:
    image: ghcr.io/opendevtools-org/homelab-hub:${HOMELAB_VERSION:-latest}
    pull_policy: always
    container_name: home-hub
    restart: unless-stopped
    environment:
      HUB_API_UPSTREAM: ${HUB_API_UPSTREAM:-http://host.docker.internal:8090}
      NGINX_ENVSUBST_FILTER: ^HUB_API_UPSTREAM$
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pkm-frontend:
    image: ghcr.io/opendevtools-org/pkm-frontend:${PKM_VERSION:-latest}
    pull_policy: always
    container_name: pkm-frontend
    restart: unless-stopped
    environment:
      PKM_API_UPSTREAM: ${PKM_API_UPSTREAM:-http://host.docker.internal:8001}
      NGINX_ENVSUBST_FILTER: ^PKM_API_UPSTREAM$
    extra_hosts:
      - "host.docker.internal:host-gateway"
