# Extra BACKENDS for this host (Market plugins and other apps). Empty by default.
# Always included with the base backend compose (see README).
# Site-owned: Update-HomelabUpstream does not overwrite this file.
#
# Site instances: Start-MarketPlugins appends
#   include:
#     - path: data/hub/plugins/<id>/docker-compose.backend.yml
#       project_directory: data/hub/plugins/<id>
# so plugin APIs join Compose project homelab-backend (not homelab-plugin-*).
# Plugin web clients use docker-compose.frontend.apps.yml + homelab-frontend.
#
# Hub/PKM image extension, cli/scriptkit mounts: docker-compose.custom.yml
# (see docker-compose.custom.example.yml). Volume chown: docker-compose.config.yml.
#
# include:
#   - path: data/hub/plugins/guacamole/docker-compose.backend.yml
#     project_directory: data/hub/plugins/guacamole

services: {}
