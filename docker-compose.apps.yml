# Extra BACKENDS for this host (Market plugins and other apps). Empty by default.
# Always included with the base backend compose (see README).
# Site-owned: Update-HomelabUpstream does not overwrite this file.
#
# Hub/PKM image extension, cli/scriptkit mounts: docker-compose.custom.yml
# (see docker-compose.custom.example.yml). Volume chown: docker-compose.config.yml.
#
# Code patches (no image rebuild): drop files in ./overrides/<service>/ instead.
# See overrides/README.md.
#
# Community market: Hub copies a command that downloads
# plugins/<id>/docker-compose.backend.yml and appends it under include
# (project_directory: . so bind mounts use this folder).
#
# Web clients are NOT included here — they run on devices via
# docker-compose.frontend.yml of each plugin.
#
# include:
#   - path: plugins/vibravid/docker-compose.backend.yml
#     project_directory: .

services: {}
