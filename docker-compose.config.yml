# One-time initialization overlay (PKM data ownership).
# Include after the base compose and network overlay, before docker-compose.apps.yml.
#
# Include with the backend project only (not with docker-compose.frontend.yml).
# Flat:
#   docker compose -f docker-compose.backend.yml -f docker-compose.lan.yml \
#     -f docker-compose.config.yml -f docker-compose.apps.yml up -d
# Site:
#   docker compose --project-directory . \
#     -f upstream/docker-compose.backend.yml -f upstream/docker-compose.lan.yml \
#     -f docker-compose.config.yml -f docker-compose.apps.yml up -d

services:
  pkm-data-permissions:
    image: busybox:1.36
    user: "0:0"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data/pkm:/data
    # Recursive chown on Docker Desktop bind mounts (Windows/macOS) walks every
    # file over virtiofs/9p and can take minutes. Those mounts are typically
    # already world-writable, so skip the walk. On Linux host dirs owned by
    # root with 0755, chown is still required and is fast on local disks.
    command:
      - sh
      - -c
      - |
        owner="$${PUID:-1000}:$${PGID:-1000}"
        marker=/data/.permissions-owner
        marked=$$(tr -d '\r' < "$$marker" 2>/dev/null || true)
        if [ "$$marked" = "$$owner" ]; then
          echo "pkm-data-permissions: already $$owner"
          exit 0
        fi
        current=$$(stat -c '%u:%g' /data 2>/dev/null || true)
        if [ "$$current" = "$$owner" ] || find /data -maxdepth 0 -perm -0002 | grep -q .; then
          printf '%s\n' "$$owner" > "$$marker"
          echo "pkm-data-permissions: skip recursive chown (writable or already $$owner)"
          exit 0
        fi
        echo "pkm-data-permissions: chown -R $$owner /data"
        chown -R "$$owner" /data
        printf '%s\n' "$$owner" > "$$marker"
    restart: "no"

  pkm-backend:
    depends_on:
      pkm-data-permissions:
        condition: service_completed_successfully
