# Publish Hub + PKM on all interfaces (LAN / company server).
# Use with base compose ONLY — do not also add docker-compose.local.yml
# (Compose concatenates `ports` and would bind the same host port twice).
services:
  hub:
    ports:
      - "3080:80"

  pkm-backend:
    ports:
      - "8001:8000"

  pkm-frontend:
    ports:
      - "3030:80"
